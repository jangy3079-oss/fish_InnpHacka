# 고수온 → 태풍 → 피난처 소실 (UC-01, UC-02 시연 시나리오)
# 출처: 2023년 8월 태풍 '카눈' 통영 사례 보도 — 태풍 전 표층 26~27℃, 중층 21~22℃였고
#       태풍 통과로 물이 섞여 층간 수온 차가 사라짐 (SRS DR-05). 시간 축과 중간값은 가정.
# 흐름 (시작 후 시간):
#   0~30h    표층 22~23℃          정상
#   30~70h   표층 23~24.5℃         급이 반응만 감소 (R7, UC-04)
#   70~132h  표층 25→26.5℃, 중층 21~22℃  중층 쏠림·활동 감소 (R1 고수온 피신)
#   132h     태풍 — 10시간에 걸쳐 수직 혼합, 중층이 표층 수온에 근접 (R2 피난처 소실)
#   ~165h    표층 28℃ 도달 = 고수온 주의보 기준 (VC-04 선행 시간 비교점)
# 특보 기준 출처: SRS A-01은 "28℃ 주의보"로 적음. 수과원 2018 「고수온 위기경보 단계별 어장관리 요령」
#       (notify/docs/nifs_high_temp_stage_manual.md)은 주의보 27~28℃, 경보 28℃ 이상. 현행 특보 기준은 확인 필요.
#       그래서 VC-04는 28℃(labels advisory_28c)와 27℃(advisory_27c) 두 기준으로 선행 시간을 함께 낸다.
# DO 곡선(7.0 → 5.4 mg/L)은 사례에 없는 가정값이다. 고수온으로 용존산소가 서서히 줄어드는 흐름만 반영했고,
#       R3 판정선(cause_rules do_low_mg_l 4.0, 공식 근거 없는 가정값)까지는 내려가지 않게 두었다.
name: heatwave_typhoon
