# 원인 추정 규칙 R1~R8 (이슈 #17)
# 근거: SDD 6.3 표, SRS FR-CAU-01~07, 6.1 시뮬레이터 기준값
#
# 출처 표기
#   [논문]  조피볼락 수온 반응 논문 (SRS 1.4, 6.1 기준값 표)
#   [사례]  2023년 통영 '카눈' 사례 (표층 26~27℃, 중층 21~22℃, SRS DR-05)
#   [가정]  설계 가정값. 현장 실증에서 보정한다.
#   [확인]  값을 아직 정하지 못했다. 정해진 뒤 채운다.
#
# 규칙마다 조건을 만족한 정도로 점수(0~1)를 내고, 점수를 합이 1이 되게 나눠 확률로 표시한다.
# 화면에는 "진단"이 아닌 "의심"으로만 쓴다 (FR-CAU-04, NFR-EXP-02).

# 공통 환경 기준값
env_constants:
  feeding_drop_temp_c: 23      # [논문] 23℃ 이상 먹이섭취량 감소
  behavior_disturb_temp_c: 25  # [논문] 25℃ 행동·대사 교란 시작
  advisory_temp_c: 28          # [논문] 28℃ 고수온 주의보 기준 (VC-04 비교점)
  do_low_mg_l: 4.0             # [가정] 저산소 기준 DO. 수과원·해수부의 양식 어류 공식 DO 기준은 찾지 못함 (2026-11-27, #20).
                               # 시스템 내부 판정용 임시값이며 알림 문구에 수치로 쓰지 않는다 (C-04). 참고: 현장에서 빈산소수괴를 3 mg/L 이하로 설명하는 사례가 있음
  # "수온·DO 정상"의 정의 (R5, R8)
  normal_env:
    temp_surface_max_c: 25
    do_min_mg_l: 4.0           # do_low_mg_l 과 같은 값을 쓴다

# 확률 표시
probability:
  method: normalize_sum_to_one
  min_display: 0.05            # [가정] 이보다 낮은 후보는 화면에서 생략
  scoring: binary_all_required # [가정, #25] 모든 필수 조건 충족=1, 그 외=0. 정규화 값은 통계적 진단 확률이 아님
  tie_break_order: [R2, R3, R4, R8, R6, R1, R5, R7] # [가정, #152·#174] 기존 순위 보존, R7은 다른 원인 조건이 없을 때만

rules:
  R1:
    name: 고수온 (피신 중)
    phase: mvp                 # 해커톤 구현
    behavior:
      mid_low_ratio_x_min: 1.5   # 중·저층 비율이 기준선 대비 1.5배 이상 [가정]
      activity_change_max: -0.20 # 활동량 -20% 이하 [가정]
    env:
      temp_surface_min_c: 25     # [논문]
      temp_diff_min_c: 3         # 표층-중층 차 3℃ 이상 [사례]
    first_action: [stop_feeding, oxygen_boost]

  R2:
    name: 피난처 소실
    phase: mvp
    behavior:
      # 둘 중 하나를 만족하면 행동 조건 충족 (#60). SDD 원안은 둘 다였으나 밤에는 기준선 대비 값이
      # 잘 안 보여 데이터 쪽 stress/levels.py 가 "하나"로 구현함. 백엔드 #25 도 같게 맞춘다.
      activity_change_max: -0.40 # 활동량 기준선 대비 -40% 이하 [가정]
      cohesion_drop: 0.30        # 응집도 급락: 직전 lookback_h 시간 최고값보다 0.3 이상 하락 [가정, #60]
      lookback_h: 12             # 위 최고값을 보는 시간 (시간) [가정, #60]
    env:
      temp_diff_max_c: 1         # 표층-중층 차 1℃ 미만으로 떨어짐 [사례]
      temp_surface_min_c: 25     # [논문]
    immediate_danger: true       # thresholds.yaml 의 immediate_danger_rules 와 연결
    first_action: [immediate_alert, compare_options]
    compare_options: [net_depth_adjust, overwinter_move, early_harvest, emergency_release]

  R3:
    name: 저산소
    phase: mvp
    behavior:
      surface_ratio_x_min: 1.5   # 표층 비율 증가 [확인] 증가 배수 미정, 임시값
      camera_surface_breathing: true  # 카메라가 있으면 수면 호흡도 근거로 사용
    env:
      do_max_mg_l: 4.0           # env_constants.do_low_mg_l 미만 [확인]
    first_action: [oxygen_supply, density_control]

  R4:
    name: 적조
    phase: recommended               # 엔진 판정 구현 (#174). 실제 특보 수집은 #45
    behavior:
      activity_change_abs_min: 0.50  # 급격한 활동 변화 [확인] 기준값 미정, 임시값. 기준선 대비 ±50% 이상
    env:
      red_tide_advisory: true    # 적조 특보 발령 해역 (수과원 자료, 이슈 #43). 외부 입력 CauseContext.red_tide_advisory
      advisory_stages: [advisory, warning]  # [가정, #45] 주의보·경보를 '특보 발령'으로 본다. 예비주의보(watch)는 제외
    first_action: [stop_feeding, red_tide_guideline]

  R5:
    name: 질병 의심
    phase: mvp
    behavior:
      score_rising_days_min: 3   # 이상 지수가 3일 이상 서서히 상승 [가정]
      min_daily_increase: 1.0   # [가정, #26] 완료된 24시간 블록 평균이 블록마다 최소 1점 상승
      min_daily_coverage: 0.8   # [가정, #26] 각 블록 유효 점수 관측 비율. 야간 포함 24시간 평균
    env:
      normal_env: true           # 수온·DO 정상
      advisory_active: false     # 특보 없음
    first_action: [common_first_aid, diagnosis_request]   # SDD 6.5, config/first_aid.yaml

  R6:
    name: 작업 스트레스
    phase: recommended              # 엔진 판정 구현 (#174). 작업 기록 입력 API는 #45
    behavior:
      score_rise_after_work: true   # 작업 기록 직후 지수 상승
      pre_work_hours: 6             # [가정, #174] 작업 전 평균 지수를 잴 구간
      rise_window_hours: 6          # [가정, #174] 작업 후 '직후' 구간
      min_score_rise: 20            # [가정, #174] 작업 전 평균 대비 직후 최고 지수 상승폭(점)
      not_recovered_hours: 24       # 24시간 내 회복 안 됨 [가정]. 작업 24시간 뒤에도 지수 ≥ cause_min_stress
      max_hours_after_work: 72      # [가정, #174] 작업 기록을 원인 후보로 보는 기간
    env:
      work_log: [net_change, sorting]  # 망갈이·선별 기록. 외부 입력 CauseContext.work_log_at/work_log_type
    first_action: [recovery_monitoring, feeding_adjust]

  R7:
    name: 섭식 저하
    phase: mvp                     # #152 구현. 현장 검증 여부와 별개
    behavior:
      feeding_response_only: true    # 급이 반응만 감소, 나머지는 정상
      feeding_change_max: -0.15      # [가정, #152] 밤낮 기준선 대비 15% 이상 감소
      activity_change_abs_max: 0.2   # [가정, #152] 절댓값이 이 값 미만
      lower_layers_ratio_x_max: 1.5  # [가정, #152] 중·저층 쏠림 비율이 이 값 미만
      missing_observation: pause     # [가정, #152] 카메라 근거 누락은 직전 R7 유지
      max_hold_hours: 24             # [가정, #152] 마지막 유효 급이 관측부터 최대24시간
    env:
      temp_surface_min_c: 23         # [논문]
    first_action: [feed_reduction]
    feed_reduction_pct: 20           # UC-04: 사료 20% 감량 권장 [가정]
    ignore_cause_min_stress: true    # thresholds.yaml 의 cause_min_stress 예외

  R8:
    name: 기생충 의심
    phase: mvp                       # 해커톤은 시뮬레이터 rubbing_rate 로 시연
    behavior:
      rubbing_rate_x_min: 3.0        # 기준선 대비 3배 이상 [가정]
      sustained_hours_min: 6         # 6시간 이상 지속 [가정]
      missing_observation: pause      # [가정, #26] 저품질/야간 시간은 누적하지 않음. 관측된 정상은 초기화
    env:
      normal_env: true
      advisory_active: false
    first_action: [common_first_aid, parasite_exam_request]  # 검경 진단 요청, SDD 6.5
