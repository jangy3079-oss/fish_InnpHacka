# 질병 계열 공통 1차 조치 + 알림에서 막을 약품 사전 (이슈 #17)
# 근거: SDD 6.5, SRS C-01, C-04, FR-DEC-07, VC-08
#
# 질병(R5)·기생충(R8) 의심 때는 손익 비교 대신 이 목록으로 안내한다.
# 시스템은 약품을 처방하지 않고, 약품명·투약량도 내보내지 않는다.

# 공통 1차 조치 (SDD 6.5의 5개)
# text는 임시 문구다. 알림에 쓰는 문구는 수과원 관리요령(notify/docs/, 이슈 #20)에서
# 찾은 내용만 쓴다 (C-04).
# source_status를 실제 스키마 필드로 관리한다 (#28). official이고 문구가 출처에 있는 항목만 제공한다.
# source_status: official = 수과원 공식 자료에 같은 조치가 있음 (문서 연도는 notify/docs 참고)
#                partial = 공식 문서에 비슷한 항목이 있으나 이 상황(질병 등)용은 아님
#                secondary = 보도 기사만 있음 (수과원 원문 확인 필요)
#                pending = 근거 없음. 근거를 찾기 전에는 알림에 쓰지 않는다
common_first_aid:
  - id: feed_reduction
    name: 사료 공급 조절
    text: "먹이를 먹는 상태가 활발하지 않으면 먹이 공급을 중단해야 한다."
    source: notify/docs/nifs_disease_rearing_management.md
    source_status: official
    # source_status: official # 포식량 70~80%, 활발하지 않으면 중단 (D4), 고수온기 과잉 투여 금물 (D5)
  - id: density_control
    name: 밀도 조절
    text: "사육밀도를 낮추고 수질을 개선하는 등 스트레스 요인을 줄이는 것이 중요하다."
    source: notify/docs/nifs_disease_rearing_management.md
    source_status: official
    # source_status: official # 밀식 예방, 사육밀도 낮추기 (D4, D5, D8)
  - id: dead_fish_removal
    name: 폐사체 즉시 수거
    text: "가두리 안의 병든 고기나 폐사어를 빨리 제거해야 한다."
    source: notify/docs/nifs_disease_rearing_management.md
    source_status: official
    # source_status: official # 병든 고기·폐사어를 빨리 제거 (D5, D8)
  - id: tool_separation
    name: 이상 가두리 작업 도구 분리
    text: "이상이 있는 가두리의 작업 도구는 따로 쓰세요."
    source: pending
    source_status: pending
    # source_status: pending # "분리" 근거 없음. 공식 자료에는 기구 소독만 있음 (D6, D8). 항목을 "작업 도구 소독"으로 바꿀지 팀에서 결정
  - id: oxygen_boost
    name: 산소 보강
    text: "산소 공급을 늘리세요."
    source: notify/docs/nifs_red_tide_cage_manual.md
    source_status: partial
    # source_status: partial # 적조 단계의 산소공급장치 가동. 질병·저산소 전용 원문은 없음

# 진단 요청 문구 (SDD 6.5의 예시)
# 진단 요청: 시료어를 수산연구기관·수산기술관리소에 질병검사 의뢰 (notify/docs/nifs_disease_rearing_management.md D2)
diagnosis_request:
  disease: "진단 요청을 접수했습니다. 담당자에게 전달 대기 중입니다."
  parasite: "검경 진단 요청을 접수했습니다. 담당자에게 전달 대기 중입니다."

diagnosis_policy: # [가정, #28] 조회/저장 범위와 오래된 결과 제한. 팀 합의 후 조정
  lookback_hours: 72
  max_points: 1000
  max_cause_age_minutes: 60

# 알림에서 막을 약품 사전 (VC-08: 약품명·투약량 0건)
# 생성 문장에 아래 단어가 하나라도 있으면 그 문장을 버리고 템플릿 문장으로 보낸다.
# 이 목록은 완전하지 않다. 시험(VC-08)에서 놓친 단어가 나오면 여기에 추가한다.
blocked_terms:
  categories:          # 약품 종류
    - 항생제
    - 항균제
    - 항생물질
    - 구충제
    - 구제제
    - 백신
    - 소독제
    - 살충제
    - 약욕
    - 약품
    - 처방
    - 투약
    - 투여
    - 동물용의약품
  ingredients:         # 성분명
    - 옥시테트라사이클린
    - 테트라사이클린
    - 플로르페니콜
    - 암피실린
    - 아목시실린
    - 에리스로마이신
    - 오플록사신
    - 설파
    - 포르말린
    - 과산화수소
    - 프라지콴텔
    - 이버멕틴
    - 메벤다졸
    - 디플루벤주론
    - 트리클로르폰
  # 투약량 표현 (예: 5mg, 20 ppm, 1g/kg)
  dose_patterns:
    - '\d+(\.\d+)?\s*(mg|㎎|ml|㎖|ppm|g/kg|mg/kg|ml/L|L)'
    - '\d+(\.\d+)?\s*(밀리그램|밀리리터|피피엠)'
    - '\d+(\.\d+)?\s*(mcg|μg|µg|ug|ng|g|kg|cc|IU|정|캡슐)' # #28: 단위/표기 변형 회귀용. 완전한 사전은 아님
