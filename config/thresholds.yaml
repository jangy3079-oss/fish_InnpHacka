# 경보 단계·유지 시간·중복 억제·융합 가중치 (이슈 #17)
# 근거: SDD 5.3, 6.1, 6.2 / SRS FR-DIA-04, NFR-REL-04
# 이 파일의 값은 모두 "설계 가정값"이다. 2·3단계 현장 실증에서 다시 맞춘다 (SDD 6장).

# 한 주기 (SDD 3장)
cycle_minutes: 5

# 경보 단계 (SDD 6.2). 지수는 0~100.
# hold_hours: 이 구간에 연속으로 머물러야 해당 단계로 올린다.
levels:
  - name: normal
    label: 정상
    min: 0
    max: 39
    hold_hours: 0
  - name: caution
    label: 주의
    min: 40
    max: 59
    hold_hours: 2
  - name: warning
    label: 경고
    min: 60
    max: 79
    hold_hours: 2
  - name: danger
    label: 위험
    min: 80
    max: 100
    hold_hours: 1
    # 이 규칙이 발동하면 유지 시간 없이 즉시 위험 (R2 피난처 소실)
    immediate_rules: [R2]

# 단계가 내려갈 때: 6시간 연속으로 조건이 풀려야 한다 (경보가 오르내리는 것 방지)
downgrade_hold_hours: 6

# 같은 단계 알림은 6시간에 1회만 (NFR-REL-04)
alert_dedup_hours: 6

# 원인 추정을 시작하는 최소 스트레스 지수 (SDD 6.3). 40 미만이면 추정하지 않는다.
cause_min_stress: 40
# 위 조건의 예외 규칙 (섭식 저하는 지수가 낮아도 추정)
cause_min_stress_exceptions: [R7]

# 기준선 학습 (SDD 5.3)
baseline:
  window_hours: 1          # 특징 계산 윈도우
  min_windows: 168         # 7일치. 미만이면 warming_up (가정값)
  day_start: "06:00"       # 낮 06~18시, 나머지는 밤. 기준선은 낮·밤 따로 학습
  day_end: "18:00"

# 영상 품질 q(0~1) 기준 (SDD 6.1, 5장 M1·M2)
quality:
  clahe_min: 0.3           # M2 CLAHE 적용 구간 하한 (0.3~0.6)
  clahe_max: 0.6
  camera_only_min: 0.6     # 카메라 전용 지표(정지 비율, 외관)와 비비기는 q가 이 값 이상일 때만 사용
  rubbing_min: 0.6         # rubbing_rate 계산에 쓰는 프레임 품질 (SDD 5.4)

# 품질 가중 융합 (SDD 6.1): f = (1-w)*s + w*c
#   q < gate_low            → w = 0
#   gate_low <= q < full_at → w = max_camera_weight * (q - gate_low) / (full_at - gate_low)
#   q >= full_at            → w = max_camera_weight
# 소나가 없으면 f = c. 단 q < gate_low 이면 지표를 비운다 (거짓 경보 방지).
fusion:
  gate_low: 0.3
  full_at: 0.7
  max_camera_weight: 0.5   # 카메라는 가두리 일부만 보므로 최대 0.5
