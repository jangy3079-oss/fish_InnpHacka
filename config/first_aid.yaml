# 질병 계열 공통 1차 조치 + 알림에서 막을 약품 사전 (이슈 #17)
# 근거: SDD 6.5, SRS C-01, C-04, FR-DEC-07, VC-08
#
# 질병(R5)·기생충(R8) 의심 때는 손익 비교 대신 이 목록으로 안내한다.
# 시스템은 약품을 처방하지 않고, 약품명·투약량도 내보내지 않는다.

# 공통 1차 조치 (SDD 6.5의 5개)
# text는 임시 문구다. 알림에 쓰는 문구는 수과원 관리요령(notify/docs/, 이슈 #20)에서
# 찾은 내용만 쓴다 (C-04).
# source_status: partial = 공식 문서에 비슷한 항목이 있으나 질병용은 아님
#                secondary = 보도 기사만 있음 (수과원 원문 확인 필요)
#                pending = 근거 없음. 근거를 찾기 전에는 알림에 쓰지 않는다
common_first_aid:
  - id: feed_reduction
    name: 사료 감량
    text: "오늘 사료를 줄이세요."
    source: notify/docs/nifs_red_tide_cage_manual.md
    source_status: partial   # 적조 단계의 사료 조절(포식량 50%, 절식). 질병용 사료 감량 원문은 미확인            # 수과원 관리요령 출처 URL 입력 예정 (#20)
  - id: density_control
    name: 밀도 조절
    text: "가두리 안 밀도를 낮추세요."
    source: notify/docs/nifs_red_tide_cage_manual.md
    source_status: partial   # 표준사육밀도 유지·분산 수용. 질병용 원문은 미확인
  - id: dead_fish_removal
    name: 폐사체 즉시 수거
    text: "죽은 고기는 바로 건지세요."
    source: notify/docs/nifs_water_temp_rise_2026.md
    source_status: secondary # 보도 기사(수과원 발표 인용). 수과원 원문 확인 필요
  - id: tool_separation
    name: 이상 가두리 작업 도구 분리
    text: "이상이 있는 가두리의 작업 도구는 따로 쓰세요."
    source: pending
    source_status: pending   # 근거 없음. 보도 기사에는 "사료 도구 소독"만 있어 "도구 분리" 문구를 확정하지 못함 (#20)
  - id: oxygen_boost
    name: 산소 보강
    text: "산소 공급을 늘리세요."
    source: notify/docs/nifs_red_tide_cage_manual.md
    source_status: partial   # 산소공급장치 가동. 보도 기사에도 산소 장치 점검 있음

# 진단 요청 문구 (SDD 6.5의 예시)
diagnosis_request:
  disease: "수산질병관리사에게 진단 요청을 보냈습니다."
  parasite: "수산질병관리사에게 검경 진단 요청을 보냈습니다."

# 알림에서 막을 약품 사전 (VC-08: 약품명·투약량 0건)
# 생성 문장에 아래 단어가 하나라도 있으면 그 문장을 버리고 템플릿 문장으로 보낸다.
# 이 목록은 완전하지 않다. 시험(VC-08)에서 놓친 단어가 나오면 여기에 추가한다.
blocked_terms:
  categories:          # 약품 종류
    - 항생제
    - 항균제
    - 항생물질
    - 구충제
    - 구제제
    - 백신
    - 소독제
    - 살충제
    - 약욕
    - 약품
    - 처방
    - 투약
    - 투여
    - 동물용의약품
  ingredients:         # 성분명
    - 옥시테트라사이클린
    - 테트라사이클린
    - 플로르페니콜
    - 암피실린
    - 아목시실린
    - 에리스로마이신
    - 오플록사신
    - 설파
    - 포르말린
    - 과산화수소
    - 프라지콴텔
    - 이버멕틴
    - 메벤다졸
    - 디플루벤주론
    - 트리클로르폰
  # 투약량 표현 (예: 5mg, 20 ppm, 1g/kg)
  dose_patterns:
    - '\d+(\.\d+)?\s*(mg|㎎|ml|㎖|ppm|g/kg|mg/kg|ml/L|L)'
    - '\d+(\.\d+)?\s*(밀리그램|밀리리터|피피엠)'
